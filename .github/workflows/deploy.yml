name: Deploy to Cloudflare Workers

# 推送到 main 分支（或手动触发 workflow_dispatch）时自动部署到 Cloudflare Workers。
# 敏感信息（API 令牌、Account ID、真实 D1 database_id、可选自定义域名与 zone_id）全部通过
# GitHub Repository Secrets 注入，绝不写入公开仓库；未配置 Secrets 时自动优雅跳过。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'RELEASE_NOTES.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: cf-workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 跳过自动发版 workflow 回写版本号产生的 [skip ci] 提交（手动触发除外）
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$D1_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "未完整配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID，跳过自动部署。"
            echo "如需启用自动部署，请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加上述三个 Secrets。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Typecheck
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run typecheck

      - name: Prepare runtime wrangler.toml (inject secrets without committing)
        if: steps.check.outputs.ready == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WORKERS_DEV: ${{ secrets.WORKERS_DEV }}
          REQUIRE_CF_ACCESS: ${{ secrets.REQUIRE_CF_ACCESS }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let toml = fs.readFileSync('wrangler.toml', 'utf8');

          const replaceLine = (key, val) => {
            if (!val) return;
            const escaped = String(val).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const re = new RegExp(`^(${key}\\s*=\\s*).*$`, 'm');
            if (re.test(toml)) {
              toml = toml.replace(re, `$1"${escaped}"`);
            }
          };

          replaceLine('database_id', process.env.D1_DATABASE_ID);
          replaceLine('database_name', process.env.D1_DATABASE_NAME);
          replaceLine('name', process.env.WORKER_NAME);
          replaceLine('REQUIRE_CF_ACCESS', process.env.REQUIRE_CF_ACCESS);
          replaceLine('MAIL_DOMAIN', process.env.MAIL_DOMAIN);
          replaceLine('PLATFORM_NAME', process.env.PLATFORM_NAME);

          const customDomain = (process.env.CUSTOM_DOMAIN || '').trim();
          const zoneId = (process.env.CLOUDFLARE_ZONE_ID || '').trim();
          let workersDev = (process.env.WORKERS_DEV || '').trim().toLowerCase();

          if (customDomain) {
            if (!workersDev) workersDev = 'false';
            const routeBlock = [
              '',
              '[[routes]]',
              `pattern = "${customDomain}"`,
              'custom_domain = true',
              ...(zoneId ? [`zone_id = "${zoneId}"`] : []),
              '',
            ].join('\n');
            toml += routeBlock;
          }

          if (workersDev === 'true' || workersDev === 'false') {
            toml = toml.replace(/^workers_dev\s*=\s*(true|false)/m, `workers_dev = ${workersDev}`);
          }

          fs.writeFileSync('wrangler.toml', toml, 'utf8');
          console.log('Runtime wrangler.toml prepared successfully.');
          EOF

      - name: Deploy Worker via Wrangler
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
