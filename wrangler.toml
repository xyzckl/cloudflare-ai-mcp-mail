name = "cloudflare-ai-mcp-mail"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# 首次部署默认开启 workers.dev 以便获取临时访问地址；绑定自定义域名后，强烈建议改为 false 并重新部署，防止绕过 Cloudflare Access 直接访问默认子域名
workers_dev = true

# 每分钟执行一次：清理超时 3 分钟未初始化的凭证 + 将超期停用账号转为永久停用并归档
[triggers]
crons = ["* * * * *"]

# D1 数据库绑定：先运行 `npx wrangler d1 create ai_mcp_mail_db`，
# 把输出的 database_id 填到下面（不要把真实的 database_id 提交到公开仓库）
[[d1_databases]]
binding = "DB"
database_name = "ai_mcp_mail_db"
database_id = "00000000-0000-0000-0000-000000000000"

# 可选环境变量（敏感密钥请使用 `wrangler secret put` 设置，勿直接明文提交到 Git）
[vars]
PLATFORM_NAME = "AI Private MCP Mail"
MAIL_DOMAIN = "ai.internal"
# 如需强制要求 Cloudflare Access Zero Trust 校验，设为 "true"
REQUIRE_CF_ACCESS = "false"

# 请通过以下命令设置机密变量：
# wrangler secret put ADMIN_SECRET
# 可选（若开启注册页 Cloudflare Turnstile 防刷）：
# wrangler secret put TURNSTILE_SECRET_KEY
# wrangler secret put TURNSTILE_SITE_KEY

# 自定义域名（可选）：部署后在 Cloudflare Dashboard 为 Worker 绑定自定义域名，
# 或取消下面注释并填入你自己的域名与 zone_id
# [[routes]]
# pattern = "mail.example.com"
# custom_domain = true
# zone_id = "00000000-0000-0000-0000-000000000000"
